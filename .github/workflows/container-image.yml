name: Validate and publish OCI Vault Writer UI

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "server.py"
      - "web/**"
      - "static/**"
      - "tests/**"
      - ".github/workflows/container-image.yml"
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "server.py"
      - "web/**"
      - "static/**"
      - "tests/**"
      - ".github/workflows/container-image.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install application dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir --requirement requirements.txt
      - name: Run unit and payload-boundary tests
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=. python -m unittest discover -s tests -v
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build without publishing
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/oci-vault-writer-ui:validation

  publish:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/oci-vault-writer-ui
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long,prefix=sha-
      - name: Build and publish multi-platform image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
