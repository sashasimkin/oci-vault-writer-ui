name: Validate and publish OCI Vault Writer UI

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - "server.py"
      - "web/**"
      - "static/**"
      - "tests/**"
      - "charts/**"
      - ".github/workflows/container-image.yml"
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - "server.py"
      - "web/**"
      - "static/**"
      - "tests/**"
      - "charts/**"
      - ".github/workflows/container-image.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
      - name: Lint and render the Helm chart
        run: |
          helm lint charts/vault-writer
          helm template vault-writer charts/vault-writer \
            --set enabled=true \
            --set-string publicOrigin=https://writer.example.test \
            --set-string runtimeSecret=writer-runtime \
            --set-string ociCredentialsSecret=writer-oci-credentials \
            --set-string authSecret=writer-auth \
            --set-string allowedClientCIDR=192.0.2.1/32 \
            --set-string ingressRoute.host=writer.example.test \
            --set-string ingressRoute.tlsSecretName=writer-tls > /tmp/vault-writer.yaml
          grep -q 'kind: NetworkPolicy' /tmp/vault-writer.yaml
          grep -q 'kind: IngressRoute' /tmp/vault-writer.yaml
          grep -q '192.0.2.1/32' /tmp/vault-writer.yaml
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run unit and payload-boundary tests
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=. uv run --locked --no-sync python -m unittest discover -s tests -v
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build without publishing
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/oci-vault-writer-ui:validation

  publish:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/oci-vault-writer-ui
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long,prefix=sha-
      - name: Build and publish multi-platform image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
