{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: vault-writer
  labels:
    {{- include "vault-writer.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vault-writer
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
