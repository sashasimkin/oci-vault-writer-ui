{{- if .Values.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: vault-writer-ip-allowlist
  labels:
    {{- include "vault-writer.labels" . | nindent 4 }}
spec:
  ipAllowList:
    sourceRange:
      - {{ .Values.allowedClientCIDR | quote }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: vault-writer-auth
  labels:
    {{- include "vault-writer.labels" . | nindent 4 }}
spec:
  basicAuth:
    secret: {{ .Values.authSecret | quote }}
    removeHeader: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vault-writer
  labels:
    {{- include "vault-writer.labels" . | nindent 4 }}
spec:
  entryPoints:
    {{- toYaml .Values.ingressRoute.entryPoints | nindent 4 }}
  routes:
    - match: Host(`{{ .Values.ingressRoute.host }}`)
      kind: Rule
      middlewares:
        - name: vault-writer-ip-allowlist
        - name: vault-writer-auth
      services:
        - name: vault-writer
          port: {{ .Values.service.port }}
  tls:
    secretName: {{ .Values.ingressRoute.tlsSecretName | quote }}
{{- end }}
